services:
  - type: web
    name: helphub-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend_core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
